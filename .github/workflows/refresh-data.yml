name: Refresh chart data

on:
  schedule:
    # Monday 12:15 UTC. GitHub may delay scheduled runs.
    - cron: "15 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild series.json from public sources
        run: python3 scripts/refresh_data.py
      - name: Validate the baked file
        run: python3 scripts/validate_data.py
      - name: Commit when the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/series.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "Refresh purchasing-power chart data"
            git push
          fi
